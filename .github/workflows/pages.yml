name: Deploy public/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", "scripts/build_index.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # public/ 안의 파일을 읽어 index.html(자동 목차)을 만든다
      - name: Build index
        run: python3 scripts/build_index.py public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
